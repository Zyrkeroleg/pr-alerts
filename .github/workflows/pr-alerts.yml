name: PR alerts

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore PR state
        uses: actions/cache/restore@v4
        with:
          path: pr_alert_state.json
          key: pr-alert-state-${{ github.run_id }}
          restore-keys: pr-alert-state-

      - name: Poll PRs and send Telegram alerts
        run: python pr_alert_bot.py
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          REPO: Eksiled/jobbot

      - name: Save PR state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pr_alert_state.json
          key: pr-alert-state-${{ github.run_id }}
